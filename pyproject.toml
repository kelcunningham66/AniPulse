[project]
name = "anipulse"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.0",
  "sqlalchemy==2.0.40",
  "pydantic>=2.11.3",
  "scikit-learn==1.6.1",
  "numpy==2.2.4",
  "httpx==0.28.1",
]

[tool.vercel]
entrypoint = "index:app"

[tool.vercel.fastapi.static]
cdn = true
exclude = true
