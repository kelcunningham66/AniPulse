services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: anipulse
      POSTGRES_PASSWORD: anipulse
      POSTGRES_DB: anipulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anipulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://anipulse:anipulse@db:5432/anipulse
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "43118:43118"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A app.worker.celery worker --loglevel=INFO
    environment:
      DATABASE_URL: postgresql+psycopg://anipulse:anipulse@db:5432/anipulse
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - db
      - redis

  web:
    build: ./frontend
    ports:
      - "43117:80"
    depends_on:
      - api

volumes:
  pgdata:
